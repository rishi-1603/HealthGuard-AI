name: 'dbt_healthguard'
version: '1.0.0'
config-version: 2

profile: 'healthguard_duckdb'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_healthguard:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
