version: '3.8'

networks:
  healthguard-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  airflow_logs:
    driver: local
  lakehouse_storage:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL — Airflow metadata + optional operational DB
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: healthguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthguard_airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d healthguard_airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Airflow 3.4.0 — Real orchestration (API server, scheduler, dag-processor, triggerer)
  # ----------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:3.4.0
    container_name: healthguard-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@healthguard.local
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/healthguard_airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./warehouse:/opt/airflow/warehouse
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
    networks:
      - healthguard-net
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    image: apache/airflow:3.4.0
    container_name: healthguard-airflow-api-server
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - airflow api-server
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/healthguard_airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./warehouse:/opt/airflow/warehouse
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
    networks:
      - healthguard-net
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    image: apache/airflow:3.4.0
    container_name: healthguard-airflow-scheduler
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - airflow scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/healthguard_airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./warehouse:/opt/airflow/warehouse
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
    networks:
      - healthguard-net
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    image: apache/airflow:3.4.0
    container_name: healthguard-airflow-dag-processor
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - airflow dag-processor
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/healthguard_airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./warehouse:/opt/airflow/warehouse
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
    networks:
      - healthguard-net
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    image: apache/airflow:3.4.0
    container_name: healthguard-airflow-triggerer
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -c
      - airflow triggerer
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/healthguard_airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./warehouse:/opt/airflow/warehouse
      - ./scripts:/opt/airflow/scripts
      - ./config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
    networks:
      - healthguard-net
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # 3. Streamlit Dashboard (reads Gold data)
  # ----------------------------------------------------------------------------
  dashboard:
    build: .
    container_name: healthguard-dashboard
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/dashboard/Home.py", "--server.address=0.0.0.0", "--server.port=8501"]
    volumes:
      - .:/app
      - lakehouse_storage:/app/data/lakehouse
    networks:
      - healthguard-net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s