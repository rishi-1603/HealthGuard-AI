[theme]
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
# XSRF protection must stay enabled; it is Streamlit's default and disabling it
# weakens request integrity for no functional benefit here.
enableXsrfProtection = true
