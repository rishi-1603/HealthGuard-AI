[theme]
base = "dark"
primaryColor = "#2563eb"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#182240"
textColor = "#e8ecf4"
font = "sans serif"

[server]
headless = true
# XSRF protection must stay enabled; it is Streamlit's default and disabling it
# weakens request integrity for no functional benefit here.
enableXsrfProtection = true
