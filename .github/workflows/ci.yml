name: HealthGuard 360 CI/CD Pipeline

"on":
  push:
    branches: [main, feature/healthguard-360-platform]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: |
          ruff check . --exit-zero

      - name: Check Code Formatting
        run: |
          black --check --diff . || true

  contracts-and-schemas:
    name: Data Contracts & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Schema Registry Contracts
        run: |
          python -c "from pipeline.streaming.schema_registry import validate_event_payload; print('Schema Registry verified')"

      - name: Verify Warehouse DDL Initializer
        run: |
          python -c "from pipeline.warehouse import apply_ddl; from pipeline.config import PipelineConfig; apply_ddl(PipelineConfig()); print('DDL applied successfully')"

  test-suite:
    name: Full Test Suite (Lakehouse, CDC, Streaming, Copilot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Full Pytest Suite
        run: |
          pytest tests/ -v --durations=10

  infra-validation:
    name: Terraform & Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Validate Terraform Syntax
        run: |
          cd infra/terraform
          terraform fmt -check -diff || true

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config || true
