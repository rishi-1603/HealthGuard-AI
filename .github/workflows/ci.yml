name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model honesty audit
        run: python scripts/model_honesty_audit.py

      - name: Run evaluation-depth analyses (calibration, DCA, temporal validation)
        run: |
          python scripts/calibration_decision_curve.py
          python scripts/temporal_validation.py

      - name: Run legacy demo pipeline (kept for reference)
        run: |
          python scripts/generate_data.py
          python scripts/train_models.py

      - name: Run all tests (data quality, model, Q&A grounding, legacy smoke)
        run: pytest -q
