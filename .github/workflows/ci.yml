name: HealthGuard 360 CI/CD Pipeline

on:
  push:
    branches: [main, feature/healthguard-360-fhir-platform]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Code Formatting
        run: black --check --diff .

  contract-validation:
    name: Resource Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Validate Resource Contracts Load
        run: |
          python -c "
          import yaml
          from pathlib import Path
          contracts = ['patient', 'encounter', 'condition', 'observation']
          for c in contracts:
              with open(f'config/resource_contracts/{c}.yaml') as f:
                  yaml.safe_load(f)
              print(f'{c}.yaml: OK')
          print('All contracts valid')

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: pytest tests/ -v --durations=10

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config